[pytest]
DJANGO_SETTINGS_MODULE = core.settings.development
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
    --reuse-db
    --nomigrations
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
testpaths = tests
norecursedirs = .git .venv venv node_modules frontend staticfiles media
