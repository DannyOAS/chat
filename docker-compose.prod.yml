version: "3.10"

services:
  # Nginx reverse proxy
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - shoshchat_network

  # Django application
  web:
    build:
      context: ./shoshchat
      dockerfile: Dockerfile.prod
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --worker-class gthread
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./shoshchat/logs:/app/logs
    env_file:
      - ./shoshchat/.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - shoshchat_network

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shoshchat/backups:/backups
    env_file:
      - ./shoshchat/.env.production
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shoshchat_network
    shm_size: 256mb

  # Redis cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - shoshchat_network

  # Celery worker
  celery_worker:
    build:
      context: ./shoshchat
      dockerfile: Dockerfile.prod
    command: celery -A core worker -l info --concurrency=4 --max-tasks-per-child=1000
    volumes:
      - media_volume:/app/media
      - ./shoshchat/logs:/app/logs
    env_file:
      - ./shoshchat/.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - shoshchat_network

  # Celery beat scheduler
  celery_beat:
    build:
      context: ./shoshchat
      dockerfile: Dockerfile.prod
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./shoshchat/logs:/app/logs
    env_file:
      - ./shoshchat/.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shoshchat_network

  # Celery Flower monitoring
  flower:
    build:
      context: ./shoshchat
      dockerfile: Dockerfile.prod
    command: celery -A core flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ./shoshchat/.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
      - FLOWER_BASIC_AUTH=${FLOWER_USER}:${FLOWER_PASSWORD}
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped
    networks:
      - shoshchat_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  shoshchat_network:
    driver: bridge
